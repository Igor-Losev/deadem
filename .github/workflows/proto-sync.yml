name: Proto Synchronization

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Igor-Losev/deadem'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync proto sources
        run: npm run proto:sync

      - name: Generate proto descriptors
        run: npm run proto:build

      - name: Push to auto/proto-sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all packages/*/proto
          git diff --cached --quiet || git commit -m 'Proto: updated to the latest'
          git push --force origin HEAD:auto/proto-sync
