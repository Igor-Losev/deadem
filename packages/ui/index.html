      <h1>Deadem Explorer — Deadlock, Dota 2 and Counter-Strike 2 (CS2) Demo Parser Libraries</h1>
      <p>Deadem is a set of open-source JavaScript libraries that parse and play back Source 2 .dem replay files of Deadlock, Dota 2 and Counter-Strike 2 (CS2) in Node.js and browsers. Deadem Explorer is a live demo of these libraries. Replays are parsed in the browser and are not uploaded to a server.</p>
      <h2>Features</h2>
      <ul>
        <li>Parse Deadlock, Dota 2 and Counter-Strike 2 (CS2) replay files (.dem) in the browser.</li>
        <li>Play, pause, seek and step through a replay tick by tick.</li>
        <li>Match summary with kills, deaths and assists of every player.</li>
        <li>Demo packets and message packets as JSON.</li>
        <li>Game entities grouped by class, with their fields.</li>
        <li>String tables, user commands and the changes of each tick.</li>
        <li>Server info: tick rate, map and game build.</li>
        <li>The same libraries in Node.js and browsers.</li>
      </ul>
      <p>Built with the <a href="https://www.npmjs.com/package/@deademx/engine">@deademx/engine</a>, <a href="https://www.npmjs.com/package/@deademx/deadlock">@deademx/deadlock</a>, <a href="https://www.npmjs.com/package/@deademx/dota2">@deademx/dota2</a> and <a href="https://www.npmjs.com/package/@deademx/cs2">@deademx/cs2</a> JavaScript libraries.</p>
